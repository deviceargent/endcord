name: Build endcord-gui (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      UV: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.14

      - name: Toggle windowed mode
        run: uv run python build.py --toggle-windowed

      - name: Build with Nuitka
        run: uv run python build.py --nuitka --noclang

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: endcord-gui-windows
          path: dist/
